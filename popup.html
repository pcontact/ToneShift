<!DOCTYPE html>
<html>
  <head>
    <title>ToneShift</title>
    <style>
      body {
        font-family: sans-serif;
        width: 250px;
        padding: 10px;
      }
      .input-group {
        display: flex;
        align-items: center;
      }
      #apiKeyInput {
        flex: 1;
        margin-right: 5px;
      }
      #toggleKey {
        cursor: pointer;
        background: none;
        border: none;
        font-size: 14px;
      }
      #status {
        font-size: 12px;
        color: green;
      }
      .tooltip-container .tooltip-text {
        visibility: hidden;
        background: #333;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 6px 8px;
        position: absolute;
        z-index: 10;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        width: max-content;
        max-width: 220px;
        white-space: normal;
        box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }
    </style>
  </head>
  <body>
    <h3>ToneShift</h3>
    <p>Extension active. Select text on any page and use the sidebar.</p>

    <div class="tooltip-container" style="display:inline-block; position:relative;">
      <button id="open">Show Settings</button>
      <span class="tooltip-text" role="tooltip">Toggles the ToneShift sidebar/settings panel on the current page.</span>
    </div>

    <hr>
    <h4>Gemini API Key</h4>
    <div class="input-group">
      <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key" />
      <button id="toggleKey">show</button>
    </div>
    <button id="saveKey">Save Key</button>
    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
